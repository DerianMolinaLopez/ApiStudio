name: Proponer una mejora
description: Una idea para ApiStudio
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes: { label: ¿Qué problema resuelve?, description: Cuéntanos qué te cuesta hoy }
    validations: { required: true }
  - type: textarea
    id: propuesta
    attributes: { label: ¿Cómo lo imaginas? }
    validations: { required: true }
  - type: textarea
    id: alternativas
    attributes: { label: Alternativas, description: Cómo lo resuelves ahora u otras herramientas que lo hacen bien }
