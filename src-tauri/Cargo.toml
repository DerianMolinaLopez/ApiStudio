[package]
name = "api-studio"
version = "0.1.1"
description = "Cliente HTTP de escritorio, local y sin nube"
edition = "2021"
license = "MIT"
authors = ["Derian Molina Lopez"]
repository = "https://github.com/DerianMolinaLopez/ApiStudio"

[lib]
name = "api_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls", "http2", "cookies", "gzip", "brotli", "deflate", "multipart", "charset"
] }
url = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
cookie = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros"] }
